<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="The battle for Jerusalem: illustrated 1967 map animation"><style>
svg{background:#061524} text{paint-order:stroke;stroke:#061524;stroke-width:0.9px;stroke-linejoin:round}
.country{fill:#234052} .land-shadow{opacity:.4}
.reveal{opacity:0;animation:show .8s ease forwards} .zone{opacity:0;animation:zoneReveal 1.2s ease forwards}
.trace{stroke-dasharray:1200;stroke-dashoffset:1200;animation:trace 3s cubic-bezier(.4,0,.2,1) forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.flash{opacity:0;animation:blink 1.4s steps(2,end) infinite}
.timeline-fill{transform-origin:left;transform-box:fill-box;transform:scaleX(0);animation:progress 14s linear forwards}
.fadeexit{animation:disappear 1.2s 4s forwards}
@keyframes show{to{opacity:1}} @keyframes zoneReveal{to{opacity:1}}
@keyframes trace{to{stroke-dashoffset:0}} @keyframes blink{50%{opacity:.9}} @keyframes pulse{50%{transform:scale(1.18);opacity:.75}}
@keyframes progress{to{transform:scaleX(1)}} @keyframes disappear{to{opacity:0}}
@media(prefers-reduced-motion:reduce){.reveal,.zone,.trace,.timeline-fill,.pulse,.flash,.fadeexit{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102c42"/><stop offset="1" stop-color="#071422"/></linearGradient><pattern id="grid" width="53" height="53" patternUnits="userSpaceOnUse"><path d="M 53 0 L 0 0 0 53" fill="none" stroke="#95bed0" stroke-opacity=".08" stroke-width="1"/></pattern><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="3.3" markerHeight="3.3" orient="auto-start-reverse"><path d="M0 1 L11 6 L0 11 Z" fill="#efbe74"/></marker></defs><rect width="1200" height="720" fill="url(#bg)"/><rect width="1200" height="720" fill="url(#grid)"/><rect x="295" y="25" width="864" height="640" rx="12" fill="none" stroke="#648499" stroke-opacity=".25"/><text x="1130.0" y="60.0" text-anchor="end" fill="#b9d1de" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" class="" letter-spacing="2.5">THE HISTORICAL ATLAS</text><text x="1130.0" y="83.0" text-anchor="end" fill="#e9bb78" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" class="" >7 / 14</text><text x="1130.0" y="638.0" text-anchor="end" fill="#99b7c6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" class="" letter-spacing="1.2">SCHEMATIC MAP • NOT TO SCALE</text><rect x="300" y="677" width="856" height="3" rx="2" fill="#91aabd" fill-opacity=".35"/><rect x="300" y="677" width="856" height="3" rx="2" fill="#efbe74" class="timeline-fill"/><g opacity=".44"><path d="M330 110 L230 610" stroke="#7ba0ac" stroke-width="1" stroke-opacity=".36"/><path d="M400 110 L300 610" stroke="#7ba0ac" stroke-width="1" stroke-opacity=".36"/><path d="M470 110 L370 610" stroke="#7ba0ac" stroke-width="1" stroke-opacity=".36"/><path d="M540 110 L440 610" stroke="#7ba0ac" stroke-width="1" stroke-opacity=".36"/><path d="M610 110 L510 610" stroke="#7ba0ac" stroke-width="1" stroke-opacity=".36"/><path d="M680 110 L580 610" stroke="#7ba0ac" stroke-width="1" stroke-opacity=".36"/><path d="M750 110 L650 610" stroke="