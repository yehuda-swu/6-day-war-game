<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="The battle for Jerusalem: illustrated 1967 map animation"><style>
svg{background:#061524}.military-unit{opacity:0;animation:militaryReveal .5s ease forwards}.military-unit use{overflow:visible}@keyframes militaryReveal{to{opacity:1}} text{paint-order:stroke;stroke:#061524;stroke-width:0.9px;stroke-linejoin:round}
.country{fill:#234052} .land-shadow{opacity:.4}
.reveal{opacity:0;animation:show .8s ease forwards} .zone{opacity:0;animation:zoneReveal 1.2s ease forwards}
.trace{stroke-dasharray:1200;stroke-dashoffset:1200;animation:trace 3s cubic-bezier(.4,0,.2,1) forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.flash{opacity:0;animation:blink 1.4s steps(2,end) infinite}
.timeline-fill{transform-origin:left;transform-box:fill-box;transform:scaleX(0);animation:progress 14s linear forwards}
.fadeexit{animation:disappear 1.2s 4s forwards}
@keyframes show{to{opacity:1}} @keyframes zoneReveal{to{opacity:1}}
@keyframes trace{to{stroke-dashoffset:0}} @keyframes blink{50%{opacity:.9}} @keyframes pulse{50%{transform:scale(1.18);opacity:.75}}
@keyframes progress{to{transform:scaleX(1)}} @keyframes disappear{to{opacity:0}}
@media(prefers-reduced-motion:reduce){.military-unit{opacity:1!important;animation:none!important}.reveal,.zone,.trace,.timeline-fill,.pulse,.flash,.fadeexit{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
