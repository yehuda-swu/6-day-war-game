<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Animated schematic map of divided Jerusalem and the Old City in June 1967">
<style>
svg{background:#071321;font-family:Arial,Helvetica,sans-serif}
text{paint-order:stroke;stroke:#071321;stroke-width:.8px;stroke-linejoin:round}
@keyframes fade{to{opacity:1}} @keyframes trace{to{stroke-dashoffset:0}} @keyframes pulse{50%{transform:scale(1.12)}} @keyframes progress{to{transform:scaleX(1)}}
.fade{opacity:0;animation:fade .8s ease forwards}.trace{stroke-dasharray:900;stroke-dashoffset:900;animation:trace 3.8s ease forwards}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}.timeline{transform:scaleX(0);transform-origin:left;animation:progress 14s linear forwards}
@media (prefers-reduced-motion:reduce){.fade,.trace,.pulse,.timeline{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10283f"/><stop offset="1" stop-color="#071321"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9ec3d7" stroke-opacity=".08"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#efbe74"/></marker>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<rect width="1200" height="720" fill="url(#grid)"/>
<rect x="60" y="50" width="1080" height="620" rx="20" fill="none" stroke="#6f8ea5" stroke-opacity=".3"/>
<text x="100" y="100" fill="#efbe74" font-size="17" font-weight="700" letter-spacing="2">THE HISTORICAL ATLAS</text>
<text x="100" y="128" fill="#d6e2ea" font-size="30" font-weight="700">A divided Jerusalem</text>
<text x="1100" y="100" text-anchor="end" fill="#d6e2ea" font-size="13" letter-spacing="2">7 / 14</text>
<text x="1100" y="122" text-anchor="end" fill="#94b4c8" font-size="12">SCHEMATIC • NOT TO SCALE</text>

<!-- terrain blocks -->
<path d="M220 150 L640 130 L740 170 L760 250 L680 330 L690 420 L610 560 L300 560 L215 440 L210 240 Z" fill="#2b4558" opacity=".95"/>
<path d="M760 170 L970 180 L1010 240 L1000 520 L790 540 L690 420 L680 330 L760 250 Z" fill="#536c7d" opacity=".9"/>
<path d="M738 150 L760 160 L760 545 L735 535 Z" fill="#9fd4e1" opacity=".7"/>
<text x="458" y="180" text-anchor="middle" fill="#b8cfdb" font-size="18" font-weight="700" letter-spacing="1.8">WEST JERUSALEM</text>
<text x="895" y="180" text-anchor="middle" fill="#b8cfdb" font-size="18" font-weight="700" letter-spacing="1.8">EAST JERUSALEM</text>
<text x="775" y="132" text-anchor="middle" fill="#9fd4e1" font-size="13" font-weight="700">1949 ARMISTICE LINE</text>

<!-- old city icon -->
<g class="fade" style="animation-delay:1.6s">
  <text x="900" y="314" text-anchor="middle" fill="#f0d7a2" font-size="16" font-weight="700" letter-spacing="1">OLD CITY</text>
  <rect x="838" y="324" width="124" height="112" rx="10" fill="#20384b" stroke="#efbe74" stroke-width="3"/>
  <path d="M850 338H950V422H850Z" fill="none" stroke="#d8c2a0" stroke-width="3" stroke-dasharray="6 5"/>
  <path d="M874 366 Q900 334 926 366 V392 H874 Z" fill="#d8c2a0" opacity=".9"/>
  <circle cx="900" cy="366" r="20" fill="#efbe74"/>
  <rect x="871" y="392" width="58" height="16" fill="#d8c2a0"/>
  <path d="M850 338H950" stroke="#d8c2a0" stroke-width="3"/>
  <path d="M850 422H950" stroke="#d8c2a0" stroke-width="3"/>
  <path d="M850 338V422" stroke="#d8c2a0" stroke-width="3"/>
  <path d="M950 338V422" stroke="#d8c2a0" stroke-width="3"/>
  <text x="900" y="452" text-anchor="middle" fill="#b5cad6" font-size="12">Walls and Dome of the Rock</text>
</g>

<!-- callouts -->
<g class="fade" style="animation-delay:2.6s"><circle cx="780" cy="265" r="6" fill="#efbe74"/><circle cx="780" cy="265" r="15" fill="#efbe74" opacity=".16"/><text x="800" y="258" fill="#f1e9d9" font-size="12" font-weight="700">MOUNT SCOPUS</text></g>
<g class="fade" style="animation-delay:3.1s"><circle cx="715" cy="220" r="6" fill="#efbe74"/><circle cx="715" cy="220" r="15" fill="#efbe74" opacity=".16"/><text x="695" y="205" text-anchor="end" fill="#f1e9d9" font-size="12" font-weight="700">AMMUNITION HILL</text></g>
<g class="fade" style="animation-delay:3.7s"><circle cx="820" cy="470" r="6" fill="#efbe74"/><circle cx="820" cy="470" r="15" fill="#efbe74" opacity=".16"/><text x="840" y="463" fill="#f1e9d9" font-size="12" font-weight="700">MOUNT OF OLIVES</text></g>

<!-- movement arrows -->
<path d="M410 360 C520 330,640 300,760 265" stroke="#efbe74" stroke-width="14" opacity=".16" fill="none" stroke-linecap="round"/>
<path d="M410 360 C520 330,640 300,760 265" class="trace" style="animation-delay:2.4s" stroke="#efbe74" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M425 392 C560 420,660 455,805 470" stroke="#efbe74" stroke-width="14" opacity=".16" fill="none" stroke-linecap="round"/>
<path d="M425 392 C560 420,660 455,805 470" class="trace" style="animation-delay:5.2s" stroke="#efbe74" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- unit cards -->
<g class="fade" style="animation-delay:2.3s"><rect x="360" y="332" width="82" height="62" rx="9" fill="#081829" stroke="#86d6f0"/><text x="401" y="353" text-anchor="middle" fill="#86d6f0" font-size="23">✦</text><rect x="387" y="308" width="28" height="18" fill="#fff"/><rect x="387" y="311" width="28" height="2.6" fill="#1e68b9"/><rect x="387" y="321.4" width="28" height="2.6" fill="#1e68b9"/><path d="M401 314.6L404.7 320.7H397.3ZM401 320.9L397.3 314.8H404.7Z" fill="none" stroke="#1e68b9" stroke-width="1"/><text x="401" y="385" text-anchor="middle" fill="#f6e4c8" font-size="10" font-weight="700">IDF</text></g>
<g class="fade" style="animation-delay:5.0s"><rect x="370" y="465" width="82" height="62" rx="9" fill="#081829" stroke="#86d6f0"/><text x="411" y="488" text-anchor="middle" fill="#86d6f0" font-size="22">▣</text><rect x="397" y="441" width="28" height="18" fill="#fff"/><rect x="397" y="444" width="28" height="2.6" fill="#1e68b9"/><rect x="397" y="454.4" width="28" height="2.6" fill="#1e68b9"/><path d="M411 447.6L414.7 453.7H407.3ZM411 453.9L407.3 447.8H414.7Z" fill="none" stroke="#1e68b9" stroke-width="1"/><text x="411" y="518" text-anchor="middle" fill="#f6e4c8" font-size="10" font-weight="700">IDF</text></g>
<g class="fade" style="animation-delay:1.1s"><rect x="835" y="210" width="82" height="62" rx="9" fill="#081829" stroke="#efbe74"/><text x="876" y="234" text-anchor="middle" fill="#efbe74" font-size="20">✹</text><rect x="862" y="186" width="28" height="18" fill="#fff"/><rect x="862" y="186" width="28" height="6" fill="#111"/><rect x="862" y="198" width="28" height="6" fill="#21834d"/><path d="M862 186L875 195L862 204Z" fill="#bb233c"/><text x="876" y="263" text-anchor="middle" fill="#f6e4c8" font-size="10" font-weight="700">JORDAN</text></g>

<g class="fade" style="animation-delay:7.6s"><rect x="680" y="560" width="324" height="60" rx="12" fill="#081523" stroke="#efbe74" stroke-opacity=".7"/><text x="700" y="588" fill="#efbe74" font-size="15" font-weight="700">Israeli forces secured the approaches first</text><text x="700" y="608" fill="#b7c8d6" font-size="12">The Old City was entered on 7 June through Lions' Gate.</text></g>
<rect x="120" y="650" width="960" height="4" rx="2" fill="#8ba8ba" fill-opacity=".35"/>
<rect x="120" y="650" width="960" height="4" rx="2" fill="#efbe74" class="timeline"/>
</svg>
